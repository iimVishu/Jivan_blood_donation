version: 2

updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/frontend'
      - '/backend'
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      non-major:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
